name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev libgmock-dev pkg-config
          # Some distros provide gtest as source package; ensure libs for linking

      - name: Build & Run Tests
        run: |
          chmod +x ./scripts/build_all.sh
          ./scripts/build_all.sh test
