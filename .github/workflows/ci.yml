name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Install packages listed in .github/apt-packages.txt
          xargs -a .github/apt-packages.txt sudo apt-get install -y
          # Some distros provide gtest as source package; ensure libs for linking

      - name: Cache apt lists and archives
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Build & Run Tests
        run: |
          chmod +x ./scripts/build_all.sh
          ./scripts/build_all.sh test
